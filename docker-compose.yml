services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skyguard-backend
    ports:
      - "8000:8000"
    # Secrets come from backend/.env (copy backend/.env.example); never inline them here.
    env_file:
      - backend/.env
    environment:
      - ML_MODEL_DIR=/app/ml/models
    restart: unless-stopped
